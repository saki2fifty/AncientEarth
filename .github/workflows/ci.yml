name: Validate
on:
  push:
  pull_request:

jobs:
  math:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --no-default-features --locked
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/check_asset_licenses.py
      - run: python -m unittest discover -s scripts -p test_license_checks.py
      - run: python -m unittest discover -s scripts -p test_frame_capture_analysis.py
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo check --workspace --all-targets --locked
      - run: cargo test --bin ancient-earth --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/software_licenses.py --check
